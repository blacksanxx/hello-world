<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #faf8ef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        h1 {
            color: #776e65;
            font-size: 48px;
            margin-bottom: 10px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .score-container {
            display: flex;
            gap: 20px;
        }

        .score-box {
            background: #bbada0;
            padding: 10px 25px;
            border-radius: 5px;
            color: white;
            text-align: center;
        }

        .score-box .label {
            font-size: 14px;
            text-transform: uppercase;
        }

        .score-box .value {
            font-size: 24px;
            font-weight: bold;
        }

        .game-board {
            background: #bbada0;
            border-radius: 10px;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 10px;
            width: 400px;
            height: 400px;
        }

        .cell {
            background: #cdc1b4;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
            color: #776e65;
            transition: all 0.15s ease;
        }

        .cell[data-value="2"] { background: #eee4da; }
        .cell[data-value="4"] { background: #ede0c8; }
        .cell[data-value="8"] { background: #f2b179; color: #f9f6f2; }
        .cell[data-value="16"] { background: #f59563; color: #f9f6f2; }
        .cell[data-value="32"] { background: #f67c5f; color: #f9f6f2; }
        .cell[data-value="64"] { background: #f65e3b; color: #f9f6f2; }
        .cell[data-value="128"] { background: #edcf72; color: #f9f6f2; font-size: 30px; }
        .cell[data-value="256"] { background: #edcc61; color: #f9f6f2; font-size: 30px; }
        .cell[data-value="512"] { background: #edc850; color: #f9f6f2; font-size: 30px; }
        .cell[data-value="1024"] { background: #edc53f; color: #f9f6f2; font-size: 24px; }
        .cell[data-value="2048"] { background: #edc22e; color: #f9f6f2; font-size: 24px; }

        .controls {
            display: flex;
            gap: 15px;
        }

        button {
            background: #8f7a66;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #9f8b77;
        }

        .instructions {
            color: #776e65;
            text-align: center;
            margin-top: 20px;
            line-height: 1.6;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(250, 248, 239, 0.9);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .game-over.active {
            display: block;
        }

        .game-over h2 {
            color: #776e65;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>2048</h1>
        
        <div class="score-container">
            <div class="score-box">
                <div class="label">分数</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="label">最高分</div>
                <div class="value" id="best-score">0</div>
            </div>
        </div>

        <div class="game-board" id="game-board"></div>

        <div class="controls">
            <button onclick="newGame()">新游戏</button>
        </div>

        <div class="instructions">
            <p>使用 <strong>方向键</strong> 或 <strong>WASD</strong> 移动方块</p>
            <p>相同数字的方块碰撞时会合并！</p>
        </div>

        <div class="game-over" id="game-over">
            <h2 id="game-over-text">游戏结束!</h2>
            <button onclick="newGame()">再玩一次</button>
        </div>
    </div>

    <script>
        let board = [];
        let score = 0;
        let bestScore = localStorage.getItem('bestScore') || 0;
        let gameOver = false;

        const gameBoard = document.getElementById('game-board');
        const scoreElement = document.getElementById('score');
        const bestScoreElement = document.getElementById('best-score');
        const gameOverElement = document.getElementById('game-over');
        const gameOverText = document.getElementById('game-over-text');

        function initBoard() {
            board = Array(4).fill(null).map(() => Array(4).fill(0));
            addNewTile();
            addNewTile();
            score = 0;
            gameOver = false;
            updateScore();
            renderBoard();
            gameOverElement.classList.remove('active');
        }

        function addNewTile() {
            const emptyCells = [];
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (board[i][j] === 0) {
                        emptyCells.push({i, j});
                    }
                }
            }
            if (emptyCells.length > 0) {
                const {i, j} = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[i][j] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function renderBoard() {
            gameBoard.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const value = board[i][j];
                    if (value !== 0) {
                        cell.textContent = value;
                        cell.setAttribute('data-value', value);
                    }
                    gameBoard.appendChild(cell);
                }
            }
        }

        function updateScore() {
            scoreElement.textContent = score;
            bestScoreElement.textContent = bestScore;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('bestScore', bestScore);
            }
        }

        function slide(row) {
            let arr = row.filter(val => val !== 0);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr[i + 1] = 0;
                }
            }
            arr = arr.filter(val => val !== 0);
            while (arr.length < 4) {
                arr.push(0);
            }
            return arr;
        }

        function moveLeft() {
            let moved = false;
            for (let i = 0; i < 4; i++) {
                const oldRow = [...board[i]];
                board[i] = slide(board[i]);
                if (oldRow.join(',') !== board[i].join(',')) {
                    moved = true;
                }
            }
            return moved;
        }

        function moveRight() {
            let moved = false;
            for (let i = 0; i < 4; i++) {
                const oldRow = [...board[i]];
                const reversed = board[i].reverse();
                const newRow = slide(reversed);
                board[i] = newRow.reverse();
                if (oldRow.join(',') !== board[i].join(',')) {
                    moved = true;
                }
            }
            return moved;
        }

        function moveUp() {
            let moved = false;
            for (let j = 0; j < 4; j++) {
                const col = [board[0][j], board[1][j], board[2][j], board[3][j]];
                const oldCol = [...col];
                const newCol = slide(col);
                for (let i = 0; i < 4; i++) {
                    board[i][j] = newCol[i];
                }
                if (oldCol.join(',') !== newCol.join(',')) {
                    moved = true;
                }
            }
            return moved;
        }

        function moveDown() {
            let moved = false;
            for (let j = 0; j < 4; j++) {
                const col = [board[0][j], board[1][j], board[2][j], board[3][j]];
                const oldCol = [...col];
                const reversed = col.reverse();
                const newCol = slide(reversed);
                newCol.reverse();
                for (let i = 0; i < 4; i++) {
                    board[i][j] = newCol[i];
                }
                if (oldCol.join(',') !== newCol.join(',')) {
                    moved = true;
                }
            }
            return moved;
        }

        function checkGameOver() {
            // Check for empty cells
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (board[i][j] === 0) return false;
                }
            }
            // Check for possible merges
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (j < 3 && board[i][j] === board[i][j + 1]) return false;
                    if (i < 3 && board[i][j] === board[i + 1][j]) return false;
                }
            }
            return true;
        }

        function checkWin() {
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (board[i][j] === 2048) return true;
                }
            }
            return false;
        }

        function handleMove(direction) {
            if (gameOver) return;

            let moved = false;
            switch (direction) {
                case 'left':
                    moved = moveLeft();
                    break;
                case 'right':
                    moved = moveRight();
                    break;
                case 'up':
                    moved = moveUp();
                    break;
                case 'down':
                    moved = moveDown();
                    break;
            }

            if (moved) {
                addNewTile();
                renderBoard();
                updateScore();

                if (checkWin()) {
                    gameOverText.textContent = '恭喜获胜!';
                    gameOverElement.classList.add('active');
                    gameOver = true;
                } else if (checkGameOver()) {
                    gameOverText.textContent = '游戏结束!';
                    gameOverElement.classList.add('active');
                    gameOver = true;
                }
            }
        }

        function newGame() {
            initBoard();
        }

        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    handleMove('left');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    handleMove('right');
                    break;
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    handleMove('up');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    handleMove('down');
                    break;
            }
        });

        // Touch support for mobile
        let touchStartX = 0;
        let touchStartY = 0;

        gameBoard.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        gameBoard.addEventListener('touchend', (e) => {
            if (!touchStartX || !touchStartY) return;

            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;

            let diffX = touchStartX - touchEndX;
            let diffY = touchStartY - touchEndY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) {
                    handleMove('left');
                } else {
                    handleMove('right');
                }
            } else {
                if (diffY > 0) {
                    handleMove('up');
                } else {
                    handleMove('down');
                }
            }

            touchStartX = 0;
            touchStartY = 0;
        });

        // Initialize the game
        initBoard();
    </script>
</body>
</html>
